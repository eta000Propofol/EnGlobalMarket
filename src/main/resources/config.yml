# ============================================================
# EnGlobalMarket 全球市场插件 配置文件
# 修改后使用 /market reload 重载（重读本文件、修正税率、重排过期检查），或重启服务器
# 颜色代码使用 & 符号，例如 &a &b &c &6 &7
# ============================================================

# ---------------- 经济设置 ----------------
economy:
  # 成交税率（小数）：0.05 = 5%
  # - 买家支付挂牌总价（整组总价），卖家实收 = 总价 × (1 − 税率)，向下取整到 2 位小数
  # - 税额不进入任何账户，成交后直接消失
  # - 有效范围 [0, 1)：负数按 0；≥ 1 会警告并修正为 0.99；非数字（NaN）回退 0.05
  # - 修正结果会在重载/启用时写回本文件
  tax-rate: 0.05
  # 货币显示名称：追加在金额之后（如 "1000 货币"）。
  # 实际扣款与入账由 Vault 对接的经济插件负责，这里只影响显示。
  currency-name: "货币"

# ---------------- 市场设置 ----------------
market:
  # 商品未售出多少天后自动下架，物品转入卖家收货箱（默认 7）。
  # 0 = 上架后下一轮过期检查即失效（测试用）。
  expire-days: 7
  # 每名玩家同时上架的最大商品数（默认 20，小于 1 时按 1 处理）。
  max-listings-per-player: 20
  # 过期检查间隔（分钟，默认 5，小于 1 时按 1 处理）。
  # 插件启用时会先立即全量扫描一次，之后按此间隔轮询。
  check-interval-minutes: 5

# ---------------- 界面标题 ----------------
# 可用键（缺省时回退为 "&8全球市场"）：
#   market-title       市场主界面
#   create-title       创建商品
#   confirm-title      确认购买
#   manage-title       我的商品
#   manage-item-title  单个商品管理
#   claim-title        收货箱
gui:
  market-title: "&8全球市场"
  create-title: "&8创建商品"
  confirm-title: "&8确认购买"
  manage-title: "&8我的商品"
  manage-item-title: "&8商品管理"
  claim-title: "&8收货箱"

# ---------------- 提示消息 ----------------
# 全部支持 & 颜色代码，可自由改文案；占位符请原样保留，否则不会被替换：
#   %max%     上限数量（上架数 / 堆叠上限）
#   %price%   金额（含货币名）
#   %proceeds% 卖家税后实收（含货币名）
#   %item%    物品显示名
#   %amount%  单个物品堆叠数
#   %count%   件数
#   %days%    有效期天数
messages:
  no-permission: "&c你没有权限执行此命令。"
  not-player: "&c该命令只能由玩家执行。"
  # 未安装 Vault 或 Vault 无可用经济实现时的提示
  no-economy: "&c服务器未接入经济插件（Vault），无法使用市场。"
  create-no-item: "&c请先把要出售的物品放入第一格。"
  create-no-price: "&c请先设置价格。"
  create-too-many: "&c你同时上架的商品已达上限（%max% 个）。"
  # 单次上架数量超过该物品的原版堆叠上限
  create-limit-stack: "&c一次最多出售 %max% 个（原版堆叠上限）。"
  create-fail: "&c上架失败，请稍后重试。"
  create-success: "&a上架成功！商品已出现在全球市场。"
  # 价格须 > 0 且不超过 10 亿
  invalid-price: "&c价格无效，请输入大于 0 的数字（不超过 10 亿）。"
  price-prompt: "&a请在聊天栏输入价格，例如 &f123.45&a。"
  # 价格输入 60 秒内有效
  price-prompt-hint: "&7输入 &fcancel &7取消；&f60 秒&7内未输入将自动取消。"
  price-cancelled: "&e已取消价格输入。"
  price-set: "&a价格已设置为 &6%price%。"
  buy-success: "&a购买成功！共花费 &6%price%。"
  # 商品已被他人买走 / 已下架 / 记录不存在，均复用此条
  buy-sold: "&c该商品已被购买或下架。"
  buy-own: "&c不能购买自己的商品。"
  buy-no-money: "&c余额不足！需要 &6%price%。"
  sold-notify: "&a你的商品「%item%」已售出，扣除税费后到账 &6%proceeds%。"
  delist-success: "&a已下架，物品已退回你的背包。"
  not-owner: "&c你不是该商品的所有者。"
  price-change-success: "&a价格已修改为 &6%price%。"
  # 下架时背包放不下：溢出部分转入收货箱
  inventory-full: "&c背包已满，物品已放入收货箱。"
  # 购买时背包放不下：物品掉落在脚下（不经过收货箱）
  inventory-full-drop: "&c背包已满，物品已掉落在脚下。"
  claim-success: "&a已领取 %amount% 个「%item%」。"
  # 领取时背包放不下：剩余数量继续留在收货箱
  claim-partial: "&c背包已满，剩余 %amount% 个仍留在收货箱。"
  claim-pending: "&e你有 %count% 件商品在收货箱中待领取，背包空间不足。"
  claim-delivered: "&a已自动领取 %count% 件商品。"
  expired-notify: "&e你的商品「%item%」超过 %days% 天未售出，已自动下架并放入收货箱。"
  reload-success: "&a配置已重载。"
